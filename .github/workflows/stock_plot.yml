name: Stock Plot

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Ticker symbol(s), space-separated (e.g. AAPL MSFT SPY)"
        required: true
        default: "AAPL"

jobs:
  plot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate plots
        run: python plot.py ${{ github.event.inputs.symbols }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "chore: stock plot — ${{ github.event.inputs.symbols }} [skip ci]"
          git push
